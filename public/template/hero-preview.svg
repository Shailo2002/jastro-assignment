<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Abstract preview of one template rendered as desktop, tablet, and mobile frames">
  <defs>
    <linearGradient id="apSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12151f" />
      <stop offset="55%" stop-color="#0a0c13" />
      <stop offset="100%" stop-color="#070810" />
    </linearGradient>
    <linearGradient id="apAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8def" />
      <stop offset="100%" stop-color="#8ab4ff" />
    </linearGradient>
    <linearGradient id="apViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8ab4ff" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="apGlow" cx="0.5" cy="0" r="1">
      <stop offset="0%" stop-color="#5b8def" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#5b8def" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#5b8def" stop-opacity="0" />
    </radialGradient>
    <pattern id="apDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#232839" />
    </pattern>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#apSurface)" />
  <rect width="960" height="480" rx="16" fill="url(#apDots)" opacity="0.55" />
  <ellipse cx="480" cy="20" rx="430" ry="190" fill="url(#apGlow)" />

